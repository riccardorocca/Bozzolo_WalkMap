<!DOCTYPE html>
<html>
<head>
  <meta name="author" content="Riccardo Rocca">
  <meta charset="utf-8">
  <title>Bozzolo WalkMap</title>
  <meta name="apple-mobile-web-app-title" content="PC WalkMap">
  <link rel="apple-touch-icon" href="https://riccardorocca.github.io/Bozzolo_WalkMap/icon.png"/>
  <meta name="viewport" content="initial-scale=1,maximum-scale=1,user-scalable=no">
  <link href="https://api.mapbox.com/mapbox-gl-js/v2.14.1/mapbox-gl.css" rel="stylesheet">
  <script src="https://api.mapbox.com/mapbox-gl-js/v2.14.1/mapbox-gl.js"></script>

  <style id="compiled-css" type="text/css">
    body { margin: 0; padding: 0; }
    #map { position: absolute; top: 0; bottom: 0; width: 100%; }

    .menu {
        position: fixed;
        z-index: 1;
        top: 10px;
        left: 10px;
        border-radius: 3px;
        width: 100px;
        border: 1px solid rgba(0,0,0,0.4);
        font-family: 'Open Sans', sans-serif;
        font-size: 16px;
    }

    button {
        display: block;
        margin: 0;
        padding: 0;
        padding: 5px;
        text-decoration: none;
        border-bottom: 1px solid rgba(0,0,0,0.25);
        text-align: center;
        width: 100%;
        height: 50px;
    }

    button              {background: #ffffff; color: #404040;}
    button:hover        {background: #f8f8f8; color: #404040;}
    button.active       {background: #b3b3ff; color: #ffffff;}
    button.active:hover {background: #9999ff; color: #ffffff;}

    #HtmlButton0              {font-weight: bold;}
    #HtmlButton0.active       {background: #ff8080; color: #ffffff;}
    #HtmlButton0.active:hover {background: #ff6666; color: #ffffff;}

    .mapboxgl-popup-content {
        max-width: 400px;
        font: 12px/20px 'Helvetica Neue', Arial, Helvetica, sans-serif;
        padding: 0px 10px;
    }
  </style>

</head>

<body>
<div class="menu">
  <button id="HtmlButton0">MAPPE</button>
  <button id="HtmlButton1"><img src="https://riccardorocca.github.io/Bozzolo_WalkMap/mura.png"></button>
  <button id="HtmlButton11"><img src="https://riccardorocca.github.io/Bozzolo_WalkMap/segnaposto.png"></button>
  <button id="HtmlButton2">Castello</button>
  <button id="HtmlButton3">Planimetria</button>
  <button id="HtmlButton10">Planimetria 1796</button>
  <button id="HtmlButton4">Planimetria 1776</button>
  <button id="HtmlButton5">Ortofoto 1954</button>
  <button id="HtmlButton9">Territorio 1774</button>
  <button id="HtmlButton6">Topografia</button>
  <button id="HtmlButton7">Geomorfologia</button>
  <button id="HtmlButton8">Vista Satellitare</button>
</div>

<div id="map"></div>
<script>
  var button0 = document.getElementById( 'HtmlButton0' );
  var button1 = document.getElementById( 'HtmlButton1' );
  var button11 = document.getElementById( 'HtmlButton11' );
  var button2 = document.getElementById( 'HtmlButton2' );
  var button3 = document.getElementById( 'HtmlButton3' );
  var button10 = document.getElementById( 'HtmlButton10' );
  var button4 = document.getElementById( 'HtmlButton4' );
  var button5 = document.getElementById( 'HtmlButton5' );
  var button6 = document.getElementById( 'HtmlButton6' );
  var button7 = document.getElementById( 'HtmlButton7' );
  var button8 = document.getElementById( 'HtmlButton8' );
  var button9 = document.getElementById( 'HtmlButton9' );
  HideMaps();

  button1.className = 'active'
  button11.className = 'active'
  button2.className = 'active'
  button3.className = 'active'
  button10.className = 'inactive'
  button4.className = 'inactive'
  button5.className = 'active'
  button6.className = 'active'
  button7.className = 'inactive'
  button8.className = 'inactive'
  button9.className = 'active'

	mapboxgl.accessToken = 'pk.eyJ1Ijoicmljcm9jIiwiYSI6ImNpanZyajMxYTBhdmZ0dG01bmVsbG8ybzcifQ.RdmNKeWGLY_fqRmUrM9m4w';
    var map = new mapboxgl.Map({
        container: 'map',
        style: 'mapbox://styles/ricroc/cmlmb1s7o005m01se0lakfnn6',
        center: [10.4835,45.1060],
        zoom: 14
    });

    // Add geolocate control to the map.
    map.addControl(
        new mapboxgl.GeolocateControl({
            positionOptions: {enableHighAccuracy: true},
            trackUserLocation: true
        })
    );

    map.addControl(new mapboxgl.NavigationControl());

    map.on('load', function () {

      map.addSource('google-source', {
        'type': 'raster',
        'tiles': ['https://mt1.google.com/vt/lyrs=s&x={x}&y={y}&z={z}'],
        'tileSize': 256
      });

      map.addLayer(
        {
          'id': 'Satellitare Google',
          'type': 'raster',
          'source': 'google-source',
          'paint': {"raster-resampling": "linear"}
        },
        'Geomorfologia'
      );
      map.setLayoutProperty('Satellitare Google', 'visibility', 'none');

      map.loadImage('https://riccardorocca.github.io/Bozzolo_WalkMap/circle_red.png', function (error, image) {if (error) throw error; map.addImage('circle_red', image)});
      map.loadImage('https://riccardorocca.github.io/Bozzolo_WalkMap/circle_blue.png', function (error, image) {if (error) throw error; map.addImage('circle_blue', image)});
      map.loadImage('https://riccardorocca.github.io/Bozzolo_WalkMap/circle_green.png', function (error, image) {if (error) throw error; map.addImage('circle_green', image)});

      map.addSource('stelline', {
        'type': 'geojson',
        'data': {
          'type': 'FeatureCollection',
          'features': [
            {'type':'Feature','geometry':{'type':'Point','coordinates':[10.467615, 45.111123]},'properties':{'icon':'circle_green','url':'https://parrocchiabozzolo.weebly.com/abbazia-s-maria-della-gironda.html','title':"Abbazia di<br>Santa Maria<br>della Gironda"}},
            {'type':'Feature','geometry':{'type':'Point','coordinates':[10.503694, 45.126685]},'properties':{'icon':'circle_red','url':'https://www.oglioponews.it/2023/11/28/bozzolo-parco-oglio-sud-ha-acquistato-cascina-tezzoglio/','title':"Cascina<br>Tezzoglio"}},
            {'type':'Feature','geometry':{'type':'Point','coordinates':[10.477253, 45.107176]},'properties':{'icon':'circle_red','url':'','title':"Porta<br>Cremona<br>(de' Capucini)"}},
            {'type':'Feature','geometry':{'type':'Point','coordinates':[10.490118, 45.103492]},'properties':{'icon':'circle_red','url':'','title':"Porta<br>Mantova<br>(San Martino)"}},
            {'type':'Feature','geometry':{'type':'Point','coordinates':[10.485411, 45.101276]},'properties':{'icon':'circle_red','url':'','title':"Porta<br>Parma<br>(Cairoli)"}},
            {'type':'Feature','geometry':{'type':'Point','coordinates':[10.483298, 45.108179]},'properties':{'icon':'circle_red','url':'','title':"Castello<br>(scomparso)"}},
            {'type':'Feature','geometry':{'type':'Point','coordinates':[10.488143, 45.105687]},'properties':{'icon':'circle_green','url':'','title':"Chiesa di<br>San Pietro<br>(scomparsa)"}},
            {'type':'Feature','geometry':{'type':'Point','coordinates':[10.487171, 45.106019]},'properties':{'icon':'circle_green','url':'','title':"Chiesa delle<br>Monache<br>(scomparsa)"}},
            {'type':'Feature','geometry':{'type':'Point','coordinates':[10.482242, 45.104965]},'properties':{'icon':'circle_green','url':'','title':"Chiesa della<br>Disciplina"}},
            {'type':'Feature','geometry':{'type':'Point','coordinates':[10.480320, 45.105983]},'properties':{'icon':'circle_green','url':'','title':"Chiesa della<br>Santissima<br>Trinità"}},
            {'type':'Feature','geometry':{'type':'Point','coordinates':[10.482368, 45.106692]},'properties':{'icon':'circle_green','url':'','title':"Chiesa di<br>San Francesco"}},
            {'type':'Feature','geometry':{'type':'Point','coordinates':[10.485347, 45.102203]},'properties':{'icon':'circle_green','url':'','title':"Chiesa di<br>San Pietro"}},
            {'type':'Feature','geometry':{'type':'Point','coordinates':[10.481303, 45.106941]},'properties':{'icon':'circle_red','url':'','title':"Caserma<br>Bianca"}},
            {'type':'Feature','geometry':{'type':'Point','coordinates':[10.482115, 45.105481]},'properties':{'icon':'circle_red','url':'','title':"Caserma<br>Nera"}},
            {'type':'Feature','geometry':{'type':'Point','coordinates':[10.482119, 45.106270]},'properties':{'icon':'circle_red','url':'https://riccardorocca.github.io/Bozzolo_WalkMap/Municipio%203D%20texture.mp4','title':"Municipio"}},
            {'type':'Feature','geometry':{'type':'Point','coordinates':[10.482032, 45.106123]},'properties':{'icon':'circle_red','url':'','title':"Monte di<br>Pietà"}},
            {'type':'Feature','geometry':{'type':'Point','coordinates':[10.480226, 45.106534]},'properties':{'icon':'circle_red','url':'','title':"Casa<br>Piccioni"}},
            {'type':'Feature','geometry':{'type':'Point','coordinates':[10.483530, 45.106307]},'properties':{'icon':'circle_red','url':'','title':"Antica<br>Casa<br>Pasotelli"}},
            {'type':'Feature','geometry':{'type':'Point','coordinates':[10.482069, 45.107141]},'properties':{'icon':'circle_red','url':'','title':"Teatro<br>Odeon"}},
            {'type':'Feature','geometry':{'type':'Point','coordinates':[10.482804, 45.104948]},'properties':{'icon':'circle_red','url':'','title':"Casa<br>Casalini"}},
            {'type':'Feature','geometry':{'type':'Point','coordinates':[10.482523, 45.103680]},'properties':{'icon':'circle_red','url':'','title':"Casa<br>Pasotelli"}},
            {'type':'Feature','geometry':{'type':'Point','coordinates':[10.483071, 45.103465]},'properties':{'icon':'circle_red','url':'','title':"Casa<br>Morselli"}},
            {'type':'Feature','geometry':{'type':'Point','coordinates':[10.479606, 45.101640]},'properties':{'icon':'circle_red','url':'','title':"Ospedale"}},
          ]
        }
      });

      map.addLayer({
        'id': 'stelline',
        'type': 'symbol',
        'source': 'stelline',
        'layout': {
            'icon-image': ['get','icon'],
            'icon-allow-overlap': true
        }
      });
      map.setLayoutProperty('stelline', 'visibility', 'visible');

      map.on('click', 'stelline', function (e) {
          var coordinates = e.features[0].geometry.coordinates.slice();
          var url = e.features[0].properties.url;
          var title = e.features[0].properties.title;

          // Ensure that if the map is zoomed out such that multiple
          // copies of the feature are visible, the popup appears
          // over the copy being pointed to.
          while (Math.abs(e.lngLat.lng - coordinates[0]) > 180) {
          coordinates[0] += e.lngLat.lng > coordinates[0] ? 360 : -360;
        }

        if (url === "") {HTMLtext = '<p style="text-align:center">' + title + '</p>'}
        //else {HTMLtext = '<a href="'+ url + '" target="_blank"> <p style="text-align:center">' + title + '</p> </a>'};
        else {HTMLtext = '<a href="' + url + '" target="_blank"> <p style="text-align:center">' + title + '</p> </a>'};

        new mapboxgl.Popup({closeButton: false})
        .setLngLat(coordinates)
        .setHTML(HTMLtext)
        .addTo(map);
      });

      // Change the cursor to a pointer when the mouse is over the places layer.
      map.on('mouseenter', 'stelline', function () {
        map.getCanvas().style.cursor = 'pointer';
      });

      // Change it back to a pointer when it leaves.
      map.on('mouseleave', 'stelline', function () {
        map.getCanvas().style.cursor = '';
      });

    });

    button0.onclick = function () {
      if (button0.className === 'active') {
        HideMaps();
      } else {
        ShowMaps();
      }
    };

    button1.onclick = function () {
      if (button1.className === 'active') {
        map.setLayoutProperty('Mura esistenti', 'visibility', 'none');
        map.setLayoutProperty('Mura demolite', 'visibility', 'none');
        button1.className = 'inactive';
      } else {
        map.setLayoutProperty('Mura esistenti', 'visibility', 'visible');
        map.setLayoutProperty('Mura demolite', 'visibility', 'visible');
        button1.className = 'active';
      }
    };

    button11.onclick = function () {
      if (button11.className === 'active') {
        map.setLayoutProperty('stelline', 'visibility', 'none');
        button11.className = 'inactive';
      } else {
        map.setLayoutProperty('stelline', 'visibility', 'visible');
        button11.className = 'active';
      }
    };

    button2.onclick = function () {
      if (button2.className === 'active') {
        map.setLayoutProperty('Castello', 'visibility', 'none');
        button2.className = 'inactive';
      } else {
        map.setLayoutProperty('Castello', 'visibility', 'visible');
        button2.className = 'active';
      }
    };

    button3.onclick = function () {
      if (button3.className === 'active') {
        map.setLayoutProperty('Planimetria.', 'visibility', 'none');
        button3.className = 'inactive';
      } else {
        map.setLayoutProperty('Planimetria.', 'visibility', 'visible');
        button3.className = 'active';
        map.setLayoutProperty('Planimetria 1796', 'visibility', 'none');
        button10.className = 'inactive';
        map.setLayoutProperty('Planimetria 1776', 'visibility', 'none');
        button4.className = 'inactive';
      }
    };

    button10.onclick = function () {
      if (button10.className === 'active') {
        map.setLayoutProperty('Planimetria 1796', 'visibility', 'none');
        button10.className = 'inactive';
      } else {
        map.setLayoutProperty('Planimetria 1796', 'visibility', 'visible');
        button10.className = 'active';
        map.setLayoutProperty('Planimetria.', 'visibility', 'none');
        button3.className = 'inactive';
        map.setLayoutProperty('Planimetria 1776', 'visibility', 'none');
        button4.className = 'inactive';
      }
    };

    button4.onclick = function () {
      if (button4.className === 'active') {
        map.setLayoutProperty('Planimetria 1776', 'visibility', 'none');
        button4.className = 'inactive';
      } else {
        map.setLayoutProperty('Planimetria 1776', 'visibility', 'visible');
        button4.className = 'active';
        map.setLayoutProperty('Planimetria.', 'visibility', 'none');
        button3.className = 'inactive';
        map.setLayoutProperty('Planimetria 1796', 'visibility', 'none');
        button10.className = 'inactive';
      }
    };

    button5.onclick = function () {
      if (button5.className === 'active') {
        map.setLayoutProperty('Ortofoto 1954', 'visibility', 'none');
        button5.className = 'inactive';
      } else {
        map.setLayoutProperty('Ortofoto 1954', 'visibility', 'visible');
        button5.className = 'active';
      }
    };

    button9.onclick = function () {
      if (button9.className === 'active') {
        map.setLayoutProperty('Territorio 1774', 'visibility', 'none');
        button9.className = 'inactive';
      } else {
        map.setLayoutProperty('Territorio 1774', 'visibility', 'visible');
        button9.className = 'active';
      }
    };

    button6.onclick = function () {
      if (button6.className === 'active') {
        map.setLayoutProperty('Topografia', 'visibility', 'none');
        button6.className = 'inactive';
      } else {
        map.setLayoutProperty('Topografia', 'visibility', 'visible');
        button6.className = 'active';
      }
    };

    button7.onclick = function () {
      if (button7.className === 'active') {
        map.setLayoutProperty('Geomorfologia', 'visibility', 'none');
        button7.className = 'inactive';
      } else {
        map.setLayoutProperty('Geomorfologia', 'visibility', 'visible');
        button7.className = 'active';
      }
    };

    button8.onclick = function () {
      if (button8.className === 'active') {
        map.setLayoutProperty('Satellitare Google', 'visibility', 'none');
        button8.className = 'inactive';
      } else {
        map.setLayoutProperty('Satellitare Google', 'visibility', 'visible');
        button8.className = 'active';
      }
    };

    function ShowMaps() {
      button0.className = 'active';
      button1.style.display = "block";
      button2.style.display = "block";
      button3.style.display = "block";
      button4.style.display = "block";
      button5.style.display = "block";
      button6.style.display = "block";
      button7.style.display = "block";
      button8.style.display = "block";
      button9.style.display = "block";
      button10.style.display = "block";
      button11.style.display = "block";
      return;
    }

    function HideMaps() {
      button0.className = 'inactive';
      button1.style.display = "none";
      button2.style.display = "none";
      button3.style.display = "none";
      button4.style.display = "none";
      button5.style.display = "none";
      button6.style.display = "none";
      button7.style.display = "none";
      button8.style.display = "none";
      button9.style.display = "none";
      button10.style.display = "none";
      button11.style.display = "none";
      return;
    }

  </script>

</body>
</html>
