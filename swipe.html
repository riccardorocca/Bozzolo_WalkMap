<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Swipe Between Maps</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Mapbox GL -->
  <link href="https://api.mapbox.com/mapbox-gl-js/v3.18.1/mapbox-gl.css" rel="stylesheet">
  <script src="https://api.mapbox.com/mapbox-gl-js/v3.18.1/mapbox-gl.js"></script>

  <!-- Compare Plugin -->
  <script src="https://api.mapbox.com/mapbox-gl-js/plugins/mapbox-gl-compare/v0.4.0/mapbox-gl-compare.js"></script>
  <link rel="stylesheet"
        href="https://api.mapbox.com/mapbox-gl-js/plugins/mapbox-gl-compare/v0.4.0/mapbox-gl-compare.css"/>

  <style>
    body {
      margin: 0;
      padding: 0;
      overflow: hidden;
    }

    #comparison-container {
      position: absolute;
      top: 0;
      bottom: 0;
      width: 100%;
    }

    .map {
      position: absolute;
      top: 0;
      bottom: 0;
      width: 100%;
    }
  </style>
</head>

<body>

<div id="comparison-container">
  <div id="before" class="map"></div>
  <div id="after" class="map"></div>
</div>

<script>
  mapboxgl.accessToken =
    "pk.eyJ1Ijoicmljcm9jIiwiYSI6ImNpanZyajMxYTBhdmZ0dG01bmVsbG8ybzcifQ.RdmNKeWGLY_fqRmUrM9m4w";

  // ============================
  // BEFORE MAP (Normal View)
  // ============================
  const beforeMap = new mapboxgl.Map({
    container: "before",
    style: "mapbox://styles/ricroc/cmlmb1s7o005m01se0lakfnn6",
    center: [10.4835, 45.1060],
    zoom: 14
  });

  // ============================
  // AFTER MAP (Walls View)
  // ============================
  const afterMap = new mapboxgl.Map({
    container: "after",
    style: "mapbox://styles/ricroc/cmlmb1s7o005m01se0lakfnn6",
    center: [10.4835, 45.1060],
    zoom: 14
  });

  // ============================
  // Navigation Controls on BOTH
  // ============================
  beforeMap.addControl(new mapboxgl.NavigationControl());
  afterMap.addControl(new mapboxgl.NavigationControl());

  // ============================
  // ONE Geolocate Control (AFTER only)
  // ============================
  const geolocate = new mapboxgl.GeolocateControl({
    positionOptions: {
      enableHighAccuracy: true
    },
    trackUserLocation: true,
    showUserHeading: true
  });

  // Add the button only on AFTER map
  afterMap.addControl(geolocate);

  // ============================
  // Sync Location → BOTH maps
  // ============================
  geolocate.on("geolocate", (e) => {
    const lon = e.coords.longitude;
    const lat = e.coords.latitude;

    // Move BOTH maps together
    beforeMap.flyTo({
      center: [lon, lat],
      zoom: 16
    });

    afterMap.flyTo({
      center: [lon, lat],
      zoom: 16
    });
  });

  // ============================
  // AFTER MAP Layer Setup
  // ============================
  afterMap.on("load", () => {

    // Layers to hide
    const hiddenLayers = [
      "Etichette",
      "Mura demolite",
      "Castello",
      "Mappa 1",
      "Ortofoto 1954"
    ];

    // Hide unwanted layers safely
    hiddenLayers.forEach(layer => {
      if (afterMap.getLayer(layer)) {
        afterMap.setLayoutProperty(layer, "visibility", "none");
      }
    });

    // ✅ Keep walls visible
    if (afterMap.getLayer("Mura esistenti")) {
      afterMap.setLayoutProperty(
        "Mura esistenti",
        "visibility",
        "visible"
      );
    }
  });

  // ============================
  // Swipe Compare Tool
  // ============================
  new mapboxgl.Compare(
    beforeMap,
    afterMap,
    "#comparison-container"
  );

</script>

</body>
</html>
