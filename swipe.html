<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Swipe Between Maps</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Mapbox GL -->
  <link href="https://api.mapbox.com/mapbox-gl-js/v3.18.1/mapbox-gl.css" rel="stylesheet">
  <script src="https://api.mapbox.com/mapbox-gl-js/v3.18.1/mapbox-gl.js"></script>

  <!-- Compare Plugin -->
  <script src="https://api.mapbox.com/mapbox-gl-js/plugins/mapbox-gl-compare/v0.4.0/mapbox-gl-compare.js"></script>
  <link rel="stylesheet" href="https://api.mapbox.com/mapbox-gl-js/plugins/mapbox-gl-compare/v0.4.0/mapbox-gl-compare.css"/>

  <style>
    body {
      margin: 0;
      padding: 0;
      overflow: hidden;
    }

    #comparison-container {
      position: absolute;
      top: 0;
      bottom: 0;
      width: 100%;
    }

    .map {
      position: absolute;
      top: 0;
      bottom: 0;
      width: 100%;
    }
  </style>
</head>

<body>

<div id="comparison-container">
  <div id="before" class="map"></div>
  <div id="after" class="map"></div>
</div>

<script>
  mapboxgl.accessToken =
    "pk.eyJ1Ijoicmljcm9jIiwiYSI6ImNpanZyajMxYTBhdmZ0dG01bmVsbG8ybzcifQ.RdmNKeWGLY_fqRmUrM9m4w";

  // ✅ BEFORE Map (base style)
  const beforeMap = new mapboxgl.Map({
    container: "before",
    style: "mapbox://styles/ricroc/cmlmb1s7o005m01se0lakfnn6",
    center: [10.4835, 45.1060],
    zoom: 14
  });

  // ✅ AFTER Map (same style, but with layer turned ON)
  const afterMap = new mapboxgl.Map({
    container: "after",
    style: "mapbox://styles/ricroc/cmlmb1s7o005m01se0lakfnn6",
    center: [10.4835, 45.1060],
    zoom: 14
  });

  // 🔥 Ensure layer "Mura esistenti" is visible in After Map
  afterMap.on("load", () => {
    afterMap.setLayoutProperty("Etichette", "visibility", "none");
    afterMap.setLayoutProperty("Mura esistenti", "visibility", "none");
    afterMap.setLayoutProperty("Mura demolite", "visibility", "none");
    afterMap.setLayoutProperty("Castello", "visibility", "none");
    afterMap.setLayoutProperty("Mappa 1", "visibility", "none");
    afterMap.setLayoutProperty("Ortofoto 1954", "visibility", "none");
  });

  // Swipe Compare Tool
  new mapboxgl.Compare(beforeMap, afterMap, "#comparison-container");
</script>

</body>
</html>
